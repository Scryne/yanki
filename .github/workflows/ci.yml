name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    # Hat yalnız Windows'ta çalışıyor (motor venv yolu, nvidia-smi); CI aynı ortamda koşar
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest -q
      # dinleme odasının betiği ve zamanlanmış görev betikleri testlerin dışında: sözdizimi burada (Denetim 7)
      - run: node --check yanki/sayfa/uygulama.js
      - shell: pwsh
        run: |
          $hata = $false
          foreach ($f in Get-ChildItem scripts/*.ps1) {
            $e = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$e) | Out-Null
            if ($e) { $hata = $true; $e | ForEach-Object { Write-Error "$($f.Name): $($_.Message)" } }
          }
          if ($hata) { exit 1 }
