# Ses modeli eğitimi (yanki/egitim.py; Scryne 2026-10-11: "şarkı yapma modelini ve beat'ini eğit, orijinal şarkılar
# kadar kaliteli olsun"). ACE-Step 1.5 XL-SFT'ye LoRA (Side-Step "fixed" eğitimi, motor klasöründeki train.py). Vokal
# ve eşlik (beat) aynı modelde birlikte öğrenilir: ACE-Step şarkıyı tek parça üretiyor.
#
# Veri: modern stüdyo kayıtları. İlk eğitim (2026-10-11) yalnız balad/pop'tu ve elle yazılmış genel stil + tek blok
# [verse] sözle yapıldı; ölçüde kazanç vermedi. 2026-10-12: şarkılar tek türde olmayacak (Scryne) → rap/hip-hop, R&B,
# EDM/dans, rock, Latin, country/folk, uptempo pop eklendi; stil pod'da ACE-Step betimleyicisiyle yazılır (betim =
# true; üretimle aynı dil), sözler bölüm yapısıyla (yanki/yapi.py). Ses kopyası değil tür ve prodüksiyon öğrensin diye
# her sanatçıdan bir şarkı; cover listesindeki (girdi/liste.toml) ve tür denemesindeki (spikes/s21) sanatçılar yok:
# model kapak yaptığımız ya da sınadığımız kayıtları ezberlemesin. Listedeki stil, betim düşerse yedektir.

[egitim]
model = "acestep-v15-xl-sft"
gpu = "NVIDIA A40"
# Side-Step (motor/ACE-Step-1.5/docs/sidestep/Training Guide.md): 10–50 şarkı → 100–200 epoch; rank 64 varsayılan
rank = 64
alpha = 128
lr = 1e-4
# ~95 şarkı + cover kopyaları (kapak = true): epoch başı ~9,5 dk (95 şarkı 286 sn, iki kat); 15 epoch ~2,4 saat.
# 2026-10-12 öncesi 40 epoch yalnız metinden-müzik: S28'de cover üretimini kötüleştirdi (beat döngüsel, söz bulanık).
# 2026-10-12 gece (dördüncü eğitim): S30 kör testinde LoRA'lı kayıt 13 şarkının 13'ünde LoRA'sızı yendi, tam ölçek
# yarımı 6'da 5 yendi (daha çok uyarlama daha iyi) ama 17'den 4'ü yayınlanabilir → 15 → 30 epoch, ara kayıt her 10'da;
# 20. ve 30. epoch kör testte önceki (15) ile karşılaştırılır. Veri 95 → 123 (kötü çıkan türler).
# 2026-10-13 (beşinci eğitim; Scryne: "modeli en iyi hale getirmeliyiz, şarkı türlerini daha çok eğitmemiz lazım"):
# S31'de kayıp 20. epoch'tan sonra yatay, ep20 = ep30 → aynı veriyle uzatmak değil, veri eklemek. Üretimdeki ep20'den
# devam (devam; Side-Step'in devam yüklemesi yamalı, yanki/devam_yamasi.py), 123 → ~178 şarkı: keşfin hedef türleri
# (80'ler pop-rock/power ballad, 90'lar alternatif/grunge, 2000'ler pop-punk/emo, metal, country; veri neredeyse hep
# 2010 sonrasıydı, liste 80'ler/90'lar şarkılarıyla dolu) + kapalı türler (caz, blues, reggae, afrobeats, K-pop, rap).
# 12 epoch, ara kayıt 6: kör testte ep20 ile karşılaştırılır; yenemezse ep20 üretimde kalır.
# 2026-10-14 (S34; Scryne: "model en iyi halinde değil, daha fazla eğitmemiz lazım"): ek eğitim (S31b) ve beat'i sonradan
# işlemek (S32) ep20'yi yenemedi. Bütün eğitimler Side-Step varsayılanıyla yalnız dikkat katmanlarına (q/k/v/o_proj)
# LoRA'ydı; MLP'ye (gate/up/down_proj) hiç dokunulmadı. Tını ve enstrüman dokusu ("ince, bas zayıf", S32) MLP'de.
# Sıfırdan (katman kümesi değiştiği için devam yok), aynı 178 şarkı, dikkat + MLP; 20 epoch, ara kayıt 10. Kör testte
# ep20 (üretimdeki) ile karşılaştırılır; yenemezse ep20 kalır.
devam = ""
hedef_moduller = ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
epoch = 20
kaydet_her = 10
# Eğitim kesiti (sn): ses ve söz aynı yerden kesilir (söz zaman damgasıyla), söz-ses kayması öğretilmesin
en_uzun_sn = 240
# Bu kadar sonra eğitim düşmüş sayılır, pod silinir
zaman_asimi_saat = 11  # 20 epoch × ~17 dk (178 şarkı, dikkat-yalnız; S31b ölçüsü) + MLP payı ≈ 7–8 saat
# Eğitimden sonra karşılaştırmalı dinleme: bu şarkılar LoRA'sız ve LoRA'lı, aynı tohumla
# S20'nin şarkıları (balad, orkestral rock, folk, dance-pop + rap, indie rock): beat ölçüleri onlarla karşılaştırılır
# + S29'un 11 tür şarkısı (kaynakları calisma/_referans/): kör testin 17 şarkısı, önceki LoRA'nın çıktıları hazır
deneme_sarkilari = ["bruno-mars-when-i-was-your-man", "coldplay-viva-la-vida", "passenger-let-her-go",
                    "anise-k-walking-on-air", "the-fray-how-to-save-a-life", "christina-perri-jar-of-hearts",
                    "metallica-enter-sandman", "blink-182-all-the-small-things", "nirvana-smells-like-teen-spirit",
                    "shania-twain-you-re-still-the-one", "frank-sinatra-fly-me-to-the-moon", "b-b-king-the-thrill-is-gone",
                    "bob-marley-the-wailers-three-little-birds", "daddy-yankee-gasolina", "blackpink-how-you-like-that",
                    "burna-boy-last-last", "central-cee-doja"]
# LoRA'sız ve yarım ölçek önceki testte hiç kazanmadı: yalnız tam ölçek; ara kayıt 20. epoch
deneme_olcekleri = [1.0]
# 2026-10-18: ara kayıt kör testten çıktı (S31'de ep20 = ep30; dinleme yükü). Kayıt yine iner, gerekirse:
# yanki egit --deneme-yeniden <zaman> --ara 10
deneme_ara_kayitlar = []
# 2026-10-18: kör test iki tohumla (S32'de aynı dosya iki testte farklı not aldı); üretimdeki model (ep20) aynı pod'da,
# aynı güncel tarifle (CFG 10) yeniden üretilir. Önce deneme CFG'yi (cover.ek) hiç geçmiyordu ve ep20'nin karşılaştırma
# kaydı CFG 7 döneminden kalmaydı: yeni model üretimde olmayan bir tarifle ölçülürdü. 17 şarkı × 2 kol × 2 tohum = 68
# iş (~2 dk/iş A40, ~1 $). Setler dinleme odasında Karşılaştırma'ya kendiliğinden gelir (kulak_set.json).
deneme_tohum_sayisi = 2
deneme_uretim_kolu = true

