# Ses modeli eğitimi (yanki/egitim.py; Scryne 2026-10-11: "şarkı yapma modelini ve beat'ini eğit, orijinal şarkılar
# kadar kaliteli olsun"). ACE-Step 1.5 XL-SFT'ye LoRA (Side-Step "fixed" eğitimi, motor klasöründeki train.py). Vokal
# ve eşlik (beat) aynı modelde birlikte öğrenilir: ACE-Step şarkıyı tek parça üretiyor.
#
# Veri Orvane'in çizgisi: modern stüdyo kaydı piyano/akustik balad ve pop balad, İngilizce, tek solo vokal. Ses kopyası
# değil tür ve prodüksiyon öğrensin diye her sanatçıdan bir şarkı (kadın/erkek dengeli) ve cover listesindeki
# (girdi/liste.toml) sanatçıların hiçbiri yok: model kapak yaptığımız şarkıların kaydını ezberlemesin, tek bir
# sanatçının sesine kaymasın. Stil metinleri liste.toml'daki stil tanımlarıyla aynı kalıpta: çıkarımda verilen metinle
# eğitimdeki metin aynı dili konuşsun.

[egitim]
model = "acestep-v15-xl-sft"
gpu = "NVIDIA A40"
# Side-Step (motor/ACE-Step-1.5/docs/sidestep/Training Guide.md): 10–50 şarkı → 100–200 epoch; rank 64 varsayılan
rank = 64
alpha = 128
lr = 1e-4
epoch = 60
kaydet_her = 20
# Eğitim kesiti (sn): ses ve söz aynı yerden kesilir (söz zaman damgasıyla), söz-ses kayması öğretilmesin
en_uzun_sn = 240
# Bu kadar sonra eğitim düşmüş sayılır, pod silinir
zaman_asimi_saat = 6
# Eğitimden sonra karşılaştırmalı dinleme: bu şarkılar LoRA'sız ve LoRA'lı, aynı tohumla
deneme_sarkilari = ["adele-someone-like-you", "coldplay-the-scientist", "james-arthur-say-you-won-t-let-go"]
deneme_olcekleri = [0.0, 0.5, 1.0]

