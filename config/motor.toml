# ACE-Step motor ayarları. Model kimlikleri ve üretim tarifi burada yaşar, kodda değil.
# Tarifin kaynağı: docs/arastirma/01-spike-bulgulari.md (dinleme testleri 1–4).

[motor]
# ACE-Step 1.5 klonu ve kendi venv'i (gitignore)
klasor = "motor/ACE-Step-1.5"
model = "acestep-v15-xl-sft"
# 8 GB'ta XL yalnız INT8 ile sığıyor (bf16 + DiT offload: adım başı 72–150 sn)
niceleme = "int8_weight_only"
cpu_offload = true
# "anla" görevi: kaynaktan stil tanımı, BPM, ton (ACE-Step 5Hz LM). vLLM Windows'ta yok → pt
lm_model = "acestep-5Hz-lm-1.7B"
lm_backend = "pt"
# Stil/BPM/ton nereden: "musicbrainz" (sanatçı türleri + solo sanatçının cinsiyeti; BPM/ton yalnız listeden) ya da "lm"
# (ACE-Step 5Hz LM). LM ölçüldü ve uydurdu (2026-10-07: Viva La Vida → "İbranice Eurodance", Perfect → "saksafonlu
# pop-rock, 130 BPM"); varsayılan musicbrainz.
analiz_yontemi = "musicbrainz"
# analizde XL + LM birlikte 8 GB'ı taşırıyor (285 sn'lik şarkıda 10 dk sonuç yok): 2B turbo ve şarkının ortasından kesit.
# 5Hz anlamsal kodlar DiT sürümlerinde ortak (LM'nin kodları her DiT'e gidiyor).
analiz_model = "acestep-v15-turbo"
analiz_kesit_sn = 40
# Stil şarkıya özel betimden: kiralık GPU'da üretimden önce ACE-Step'in betimleyicisi (acestep-captioner) şarkıyı
# dinler; stilini Scryne yazmamış şarkılara. S20 (2026-10-12, 6 şarkı, aynı tohum): groove (orijinal ritmi izleme)
# 0,18 → 0,24, fazladan döngüsellik +0,13 → +0,04, bölümler arası değişim 0,67 → 0,80 (1 = orijinal), kapılar aynı.
# Eski stil sanatçının genel türüydü ("pop, funk song" bir piyano baladına).
betim = true
# Kendi LoRA'mız (yanki/egitim.py, kapak = true): 95 çok türlü şarkı, cover görevinde eğitildi (2026-10-12, 15 epoch).
# Yalnız kiralık GPU'da (INT8 yerel motora bağdaştırıcı uygulanmıyor). Eğitimde olmayan şarkılarda, aynı tohum,
# ölçek 0 → 1 (docs/arastirma/07, S30): balad/pop 6 şarkı groove 0,23 → 0,57, döngüsellik +0,04 → −0,16, bölüm
# değişimi 0,82 → 0,98; 11 tür groove 0,30 → 0,58, dinamik izleme 0,53 → 0,79. Söz WER'i karışık: 17 şarkının 10'unda
# düştü, 6'sında arttı (ortalama 0,104 → 0,120 balad, 0,388 → 0,374 tür). Çıktı orijinale biraz yaklaşıyor
# (parmak izi en çok 0,69, dalga 0,16; kapılar aday başına süzüyor).
# Önceki iki LoRA metinden-müzik görevinde eğitilmişti, cover'da beat'i kötüleştirdi (S28). Klasör gitignore'da.
# 2026-10-13 (S31): dördüncü eğitimin 20. epoch'u (123 şarkı). Kör test (Scryne, 17 şarkı, A/B/C): 15 epoch 3, 20 epoch
# 6, 30 epoch 6, hepsi kötü 2; yayınlanabilir 9/17 (önceki test 4/17). 20 ile 30 berabere (yayınlanabilir 4–4); 20
# seçildi: türlerde söz WER'i daha iyi (0,37 / 0,41), beat aynı, daha az eğitim orijinal kayda daha az yaslanır.
# 30 epoch: calisma/egitim/lora/20261012-1702/final
lora = "calisma/egitim/lora/20261012-1702/checkpoints/epoch_20_loss_0.7381"
lora_olcek = 1.0

[cover]
gorev = "cover"
guc = 0.7
adim = 100
# 3 aday (2026-10-07): S13'te aynı ayarla tohum söz WER'ini 0,042–0,113 oynattı, diğer kollar tohumdan küçüktü
# 4 aday (2026-10-12): söz WER'i en düşük aday Scryne'ın seçimini 11/21 tuttu (rastgele 7,2), ACE-Step'in önerisi de
# çok aday + otomatik eleme; rap'te 3 adaydan 1'i geçti. Aday başı ~2 dk A40 (~0,015 $).
aday_sayisi = 4
tohumlar = [42, 7, 123, 2024]

[onarim]
gorev = "repaint"
adim = 100
# işaretlenen aralığın iki yanına eklenen pay (sn)
pay_sn = 1.0
# her aralık için bu tohumlarla birer sürüm (dinleme testi 4: biri düzeltti, öbürü düzeltmedi)
tohumlar = [42, 7]

[gpu]
# üretime başlamadan önce kullanılan VRAM bu değerin altına inmeli (MiB); başka bir iş GPU'yu tutuyorsa beklenir
bos_esik_mib = 2000
bekleme_sn = 20

[uzak]
# Kiralık GPU (RunPod, yanki/uzak.py; Scryne 2026-10-10: "güçlü GPU ile çıktıları daha iyi yapalım"). S19 (A40):
# nicelemesiz bf16, tam şarkı tek parça 140 sn (evde INT8 parçalı ~8 dk/aday), VRAM tepe 14,4 GB; kapılar aynı düzeyde.
# Açıkken üretim sunucuda; sunucu açılamazsa ya da bütçe dolduysa evdeki kartta (INT8, parçalı).
acik = true
gpu = "NVIDIA A40"
# Bakiye bunun altındaysa ya da bu ayki harcama sınırdaysa sunucu açılmaz (USD)
en_az_bakiye = 3.0
# 15 → 25 (2026-10-12): ikinci RunPod hesabı (~10 $, .env → RUNPOD_API_KEY_2); ilkinin bakiyesi en_az_bakiye altına
# inince hat kendiliğinden ikinciye geçer (yanki/runpod.py → anahtar). 25 → 30 (2026-10-13, Scryne): beşinci eğitim
# ve kalan üretim aynı aya sığsın
aylik_butce = 30.0
# Bir koşuda sunucuda en çok kaç şarkı (şarkı başı 3 aday × ~2,5 dk + açılış ~2 dk)
sarki = 8
# Bu süreden kısa şarkı tek parça (sunucuda bölmeye gerek yok; ACE-Step sınırı 8 dk)
tek_parca_sn = 480
# Sunucu kullanılamazsa evdeki kartta (INT8, parçalı) üretilsin mi. Kapalı (Scryne, 2026-10-10: "benim bilgisayarımda
# şarkı üretmicez artık"): üretim sunucu açılabilene kadar sırada bekler. Ayrıca evde kullanıcı etkinken VAE çözme
# paylaşımlı belleğe taşıp bir saat takıldı (2026-10-10).
yerel_yedek = false

[araclar]
fpcalc = "araclar/fpcalc.exe"
