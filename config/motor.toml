# ACE-Step motor ayarları. Model kimlikleri ve üretim tarifi burada yaşar, kodda değil.
# Tarifin kaynağı: docs/arastirma/01-spike-bulgulari.md (dinleme testleri 1–4).

[motor]
# ACE-Step 1.5 klonu ve kendi venv'i (gitignore)
klasor = "motor/ACE-Step-1.5"
model = "acestep-v15-xl-sft"
# 8 GB'ta XL yalnız INT8 ile sığıyor (bf16 + DiT offload: adım başı 72–150 sn)
niceleme = "int8_weight_only"
cpu_offload = true
# "anla" görevi: kaynaktan stil tanımı, BPM, ton (ACE-Step 5Hz LM). vLLM Windows'ta yok → pt
lm_model = "acestep-5Hz-lm-1.7B"
lm_backend = "pt"
# Stil/BPM/ton nereden: "musicbrainz" (sanatçı türleri + solo sanatçının cinsiyeti; BPM/ton yalnız listeden) ya da "lm"
# (ACE-Step 5Hz LM). LM ölçüldü ve uydurdu (2026-10-07: Viva La Vida → "İbranice Eurodance", Perfect → "saksafonlu
# pop-rock, 130 BPM"); varsayılan musicbrainz.
analiz_yontemi = "musicbrainz"
# analizde XL + LM birlikte 8 GB'ı taşırıyor (285 sn'lik şarkıda 10 dk sonuç yok): 2B turbo ve şarkının ortasından kesit.
# 5Hz anlamsal kodlar DiT sürümlerinde ortak (LM'nin kodları her DiT'e gidiyor).
analiz_model = "acestep-v15-turbo"
analiz_kesit_sn = 40

[cover]
gorev = "cover"
guc = 0.7
adim = 100
# 3 aday (2026-10-07): S13'te aynı ayarla tohum söz WER'ini 0,042–0,113 oynattı, diğer kollar tohumdan küçüktü
aday_sayisi = 3
tohumlar = [42, 7, 123]

[onarim]
gorev = "repaint"
adim = 100
# işaretlenen aralığın iki yanına eklenen pay (sn)
pay_sn = 1.0
# her aralık için bu tohumlarla birer sürüm (dinleme testi 4: biri düzeltti, öbürü düzeltmedi)
tohumlar = [42, 7]

[gpu]
# üretime başlamadan önce kullanılan VRAM bu değerin altına inmeli (MiB); başka bir iş GPU'yu tutuyorsa beklenir
bos_esik_mib = 2000
bekleme_sn = 20

[uzak]
# Kiralık GPU (RunPod, yanki/uzak.py; Scryne 2026-10-10: "güçlü GPU ile çıktıları daha iyi yapalım"). S19 (A40):
# nicelemesiz bf16, tam şarkı tek parça 140 sn (evde INT8 parçalı ~8 dk/aday), VRAM tepe 14,4 GB; kapılar aynı düzeyde.
# Açıkken üretim sunucuda; sunucu açılamazsa ya da bütçe dolduysa evdeki kartta (INT8, parçalı).
acik = true
gpu = "NVIDIA A40"
# Bakiye bunun altındaysa ya da bu ayki harcama sınırdaysa sunucu açılmaz (USD)
en_az_bakiye = 3.0
aylik_butce = 15.0
# Bir koşuda sunucuda en çok kaç şarkı (şarkı başı 3 aday × ~2,5 dk + açılış ~2 dk)
sarki = 8
# Bu süreden kısa şarkı tek parça (sunucuda bölmeye gerek yok; ACE-Step sınırı 8 dk)
tek_parca_sn = 480

[araclar]
fpcalc = "araclar/fpcalc.exe"
