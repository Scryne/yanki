# Yükleme paketi ayarları. Kararlar: sanatçı adı ve dağıtımcı Scryne'ın (2026-10-07).

[yayin]
# Spotify'da görünecek sanatçı adı. Boşsa kapakta sanatçı yazmaz, YUKLE.md eksik diye işaretler.
sanatci_adi = "Orvane"  # Scryne, 2026-10-07
# "tunearo" (API: hat kendisi yükler) | "routenote" | "distrokid" (form insanda) | ""
# Scryne, 2026-10-07: RouteNote, mekanik lisans alınmadan. 2026-10-10: arkadaşın dağıtım API'si (Tunearo) geldi →
# yeni yüklemeler Tunearo'ya; RouteNote'taki üç parça orada kalır, takip ISRC'leriyle sürer.
# 2026-10-12 (Scryne): Tunearo API'si yok, yüklenen şarkılar reddedildi; yayınlananlar silindi
# (calisma/_arsiv/2026-10-12-yayin-silindi/). Yayın baştan kurulacak: dağıtımcı seçilene kadar boş (otomatik yükleme yok,
# paketler YUKLE.md ile hazır bekler).
# 2026-10-15 (Scryne: "RouteNote'a otomatik yüklemeyi yapmanı istiyorum"): RouteNote, formu hat dolduruyor
# (yanki/routenote.py, tarayıcı; API yok, docs/arastirma/08).
# 2026-10-26 (Scryne: "dağıtıcı buldum, distributemusic.ai'den atıcaz"): DistributeMusic.AI. Yeni paketler 16 bit WAV ve
# panel alanlı YUKLE.md ile; RouteNote'a yüklenmiş 14 şarkı orada kalır, takipleri (e-posta, Spotify) sürer.
dagitimci = "distributemusic"
# Kapakta ve metadata'da: plak şirketi yoksa sanatçı adı kullanılır
etiket = ""

[kapak]
# "pinterest": şarkının moduna göre Pinterest görseli, insansız ve yazısız (yanki/pinterest.py; Scryne, 2026-10-10:
# "üretilen kapağı istemiyorum"). "uretilen": dalga formundan tipografik kapak. Şarkı klasöründeki kapak_ozel.jpg
# (elle seçilen) her zaman önce gelir. Beğenilmeyen kapak: yanki kapak <kimlik> --yeni
kaynak = "pinterest"

[master]
# Zincir (yanki/paket.py → master): 28 Hz alçak kesim (DC, uğultu) → ton eşleme → sabit kazanç → 4× aşırı örneklenmiş
# tepe sınırlayıcı → 44,1 kHz 16 bit. Önce loudnorm vardı; ACE-Step çıktısının tepe/ses oranı (~16 dB) −14 LUFS'a
# doğrusal sığmadığı için sessizce dinamik moda düşüp kıta/nakarat farkını eziyordu (2026-10-11, Denetim 4).
lufs = -14.0
# Spotify sınırı −1 dBTP; pay bırakılır
gercek_tepe_dbtp = -1.2
ornekleme = 44100
# Cover'ın frekans dengesini orijinal kayda yaklaştır (yanki/ton.py): ölçümde 40–63 Hz uğultu fazlası ve 3–8 kHz vokal
# varlığı eksikliği vardı; farkın %70'i, kesme ≤ 8 dB, yükseltme ≤ 3 dB. Kapatmak: false
ton_eslesme = true

[otomatik_onay]
# Veto penceresi (yanki/onay.py): dinlemeye çıkan şarkıya `sure_saat` içinde onay/onarım/ret gelmezse kapılardan geçmiş,
# sözü en anlaşılır (en düşük söz WER) aday onaylanır. Ölçüm: bu kural Scryne'ın seçimini 15'te 4 tuttu (rastgele
# kadar). Açık (Scryne, 2026-10-10: "her şey otomatik çalışsın", ölçüm ikinci kez gösterildi, 24 saat seçildi).
# Kendiliğinden onaylanan her şarkı bildirilir.
acik = true
sure_saat = 24
# Öneriyi hangi kural verir (yanki/onay.py, yanki/estetik.py): "kural" (söz WER'i + hizalama, yukarıdaki ölçü), "estetik"
# (hazır değerlendiricilerin puanı: SongEval + Audiobox, docs/arastirma/10) ya da "otomatik": estetik, Scryne'ın en az
# 10 kulak seçiminde %70'i tutturup kuraldan iyi çıkınca kendiliğinden devreye girer (Faz 12 ölçütü; `yanki isabet`).
# 2026-10-18: kural Scryne'ı 12'de 3 tuttu (rastgele 2,1) → otomatik.
secici = "otomatik"
# Yalnız tarifi dinlenmiş tür ve dil, sözü anlaşılır aday (yanki/onay.py → DENENMEMIS). Rap, metal vb. ve İngilizce
# dışı Scryne'ın kulağına kalır (bildirilir). Ölçü: Scryne'ın onayladığı baladların en iyi söz WER'i çoğunlukla ≤ 0,1.
diller = ["en"]
en_yuksek_wer = 0.15
# Kulaktan geçmeden onaylanmayan türler (stilde aranır). Tür, tarifi dinlenip doğrulandıkça çıkar (2026-10-12).
# 2026-10-15: metal (Enter Sandman üç kör testte yayınlanabilir), pop-punk (All the Small Things iki testte) ve
# dance-pop (Walking on Air iki testte), country (You're Still the One üç testte) çıktı; punk/dance'in diğer biçimleri ve nu
# metal kulakta.
denenmemis_turler = [
  "rap", "hip[ -]?hop", "trap", "drill", "nu[ -]?metal", "(?<!pop[ -])punk", "grunge", "hardcore", "edm", "techno",
  "house", "dubstep", "trance", "electro", "(?<!pop[ -])dance(?![ -]?pop)", "reggae", "reggaeton", "latin", "salsa", "mexicano", "brazilian", "sertanejo",
  "forr[oó]", "african", "afrobeats?", "asian", "indian", "bollywood", "jazz", "blues", "gospel", "opera",
  "classical", "kids", "films", "games", "k-?pop", "j-?pop", "anime",
]

[takvim]
# Yayın takvimi (yanki/dagitim.py): paketlenmiş şarkılar kuyruk, sıra keşif puanı sonra onay sırası. Sırası gelen paket
# [routenote] gece yüklemesi açıksa gece koşusunda RouteNote'a gönderilir, değilse yalnız bildirilir (2026-10-15).
# Açık (Scryne, 2026-10-10: önce "şimdilik yayınlamayalım", sonra "devam et, her şey otomatik çalışsın"). ilk_kabul
# kapısı When We Were Young kabul edilene kadar yeni gönderimi zaten bekletir; red gelirse durur.
acik = true
# 0 = sınır yok: sırası gelen (paketlenmiş) her şarkı aynı koşuda yüklenir (Scryne, 2026-10-10: "her gün 1 tane değil,
# yükleyebildiği kadar yüklesin, hızlı hızlı hesabı kasalım"). Tunearo'nun hesap parça kotası dolarsa ("Track limit
# reached") yükleme durur ve bildirilir. Önce 7 (her gün bir), daha önce 1 (Release Radar'a göre haftada bir).
haftada = 0
# Yüklemeden kaç gün sonrası yayın tarihi. 21 RouteNote içindi (ücretsiz inceleme, pitch ≥ 7 gün). Tunearo'da en erken
# (Scryne, 2026-10-10): hesaptaki canlı yayınlar açılıştan 1–5 gün sonrasına tarihli ve 2–5 gün sonra canlıya çıkmış;
# tarih incelemede geçerse parça onaylanınca çıkar. Orvane'de Spotify for Artists yok, pitch payının karşılığı yok.
# Gönderilen yayının tarihi incelemedeyken değiştirilemiyor (409), bu yüzden en baştan kısa.
# 2026-10-15: dağıtımcı yeniden RouteNote (inceleme 5–10 iş günü, sayfadaki uyarı) → 21.
# RouteNote yükleyicisi 10 günden yakın tarihi 10'a çeker (routenote.YAYIN_ASGARI_GUN).
# 0 = tarihsiz: "Sales Start Date" boş, RouteNote onaylar onaylamaz mağazalara gider (formdaki kural). Scryne
# 2026-10-15: "şarkı yayınlanma takvimini en erken olarak ayarla" → 0.
# 2026-10-26: DistributeMusic'te tarih zorunlu, inceleme ~24 sa, Spotify 2–4 gün → en erken anlamlı tarih 2 gün sonrası.
yayin_on_gun = 2
# "surekli": kabul beklenmez, her gün yüklenir; dağıtımcı bir parçayı reddederse neden anlaşılıp düzeltilene kadar
# yeni yükleme yok (reddedilen yayın aynı kayıtla düzeltilir, parça kotası yanmaz). "ilk_kabul": ilk kabule kadar
# incelemede tek parça (Faz 7 kararı; Scryne 2026-10-10 "sürekli" deyince bırakıldı). "hemen": kapı yok.
baslangic = "surekli"

[routenote]
# Tarayıcıyla yükleme (yanki/routenote.py; oturum: yanki routenote giris).
# gece: takvim (gece/sürekli koşu) sırası gelen paketi kendisi yükleyip göndersin mi. Kapalıyken yalnız bildirir;
# yükleme `yanki yukle <kimlik>` (--taslak: gönderme) ile. Kuyruktaki eski paketler (10-13, ep20 öncesi tarif) Scryne
# karar vermeden gitmesin diye kapalı başlar (2026-10-15).
# 2026-10-15 açıldı (Scryne: "direkt olarak routenote da paylaşılsın"): otomatik onaylanan (24 sa veto penceresi)
# ve paketlenen şarkı koşuda gönderilir. Oturum düşerse yükleme durur ve "RouteNote'a giriş yap" bildirilir.
# 2026-10-26'dan beri etkisiz: koşu `[yayin] dagitimci`'daki dağıtımcıyla yükler (distributemusic); bu bayrak
# yalnız dagitimci = "routenote" iken okunur.
gece = true
# Orvane'ın Spotify sanatçı kimliği (profil oluşunca): sanatçı aramasında bu profil seçilir. Boşsa "Create a new
# profile"; hesapta aynı ada bağlı profil varsa RouteNote onu önerir ve o kullanılır.
spotify_sanatci_id = ""
# false: tarayıcı görünmeden çalışır (gece koşusu). Giriş sayfası Cloudflare arkasında; görünmezde sınanmadı.
gorunur = true

[distributemusic]
# yanki/distributemusic.py, docs/arastirma/11. Anahtarsızken panel kipi: hat paketler ve sırası geleni bildirir, Scryne
# panelden yükleyip `yanki yuklendi <kimlik>` der. `.env` → DISTRIBUTEMUSIC_API_KEY (Label 50 $/yıl + API 99 $/ay)
# eklenirse API kipi: hat yükler ve durumu yoklar.
# Şartlar §8 "yazılı lisansı olmayan telifli melodi"yi anında hesap kapatma nedeni sayıyor, cover için ayrı kural yok:
# destekten cover kabulü yazılı alınmadan API gönderimi yapılmaz. Cevap olumluysa Scryne true yapar.
sozlesme_kabul = false
# API kipinde takvim sırası gelen paketi koşuda kendisi göndersin mi (sozlesme_kabul da gerekir)
gece = false
# API `version_type` (belgedeki örnek "Original"; izinli değerler yayımlanmamış, blog "Cover"ı sayıyor)
surum_turu = "Cover"
# `ai_music_link`: ACE-Step'in şarkı başına paylaşım sayfası yok, aracın sayfası verilir (destek başka şey isteyebilir)
ai_baglanti = "https://github.com/ace-step/ACE-Step-1.5"

[tunearo]
# Tunearo API (yanki/tunearo.py; anahtar .env → TUNEARO_API_KEY). Doküman: https://api.tunearo.com/
# Bölge: mekanik lisans yok → RouteNote'taki kararla aynı bölgeler hariç (Scryne, 2026-10-07). ISO 3166-1 alpha-2.
haric_bolgeler = ["US", "CA", "MX", "IN", "PK"]
# Mağaza (Tunearo kodları, tam liste yanki/tunearo.py → MAGAZALAR). Hariç: parmak izi hak kayıtları (YouTube Content
# ID, Facebook Rights Manager, Audible Magic). Cover sound-alike kayıt, "münhasır hak" sayılmıyor; dağıtımcıların
# standardı cover'ı bunlardan çıkarmak (yanlış hak talebi riski; araştırma 2026-10-10, docs/arastirma/04).
# Amazon açık (2026-10-10): RouteNote AI içeriği Amazon'a göndermiyordu, Tunearo hesabındaki canlı AI parça Amazon'da.
haric_magazalar = ["youtube_cid", "facebook_rights", "audible_magic"]
