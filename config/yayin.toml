# Yükleme paketi ayarları. Kararlar: sanatçı adı ve dağıtımcı Scryne'ın (2026-10-07).

[yayin]
# Spotify'da görünecek sanatçı adı. Boşsa kapakta sanatçı yazmaz, YUKLE.md eksik diye işaretler.
sanatci_adi = "Orvane"  # Scryne, 2026-10-07
# "routenote" | "distrokid" | "" — form alanlarının sırası ve cover lisans adımı buna göre yazılır
dagitimci = "routenote"  # Scryne, 2026-10-07: RouteNote, mekanik lisans alınmadan
# Kapakta ve metadata'da: plak şirketi yoksa sanatçı adı kullanılır
etiket = ""

[master]
lufs = -14.0
# Spotify sınırı −1 dBTP; doğrusal loudnorm bazı şarkılarda 0,06 dB aşıyordu (2026-10-07) → pay
gercek_tepe_dbtp = -1.2
ornekleme = 44100

[otomatik_onay]
# Veto penceresi (yanki/onay.py): dinlemeye çıkan şarkıya `sure_saat` içinde onay/onarım/ret gelmezse kapılardan geçmiş,
# sözü en anlaşılır (en düşük söz WER) aday onaylanır. Ölçüm: bu kural Scryne'ın seçimini 15'te 4 tuttu (rastgele
# kadar) → kapalı; dağıtım API'siyle tam otomasyonda açılır (Roadmap Faz 10).
acik = false
sure_saat = 72

[takvim]
# Yayın takvimi (yanki/dagitim.py): paketlenmiş şarkılar kuyruk, sıra keşif puanı sonra onay sırası. Sırası gelen paket
# bildirilir (RouteNote'ta API yok, yükleme elle); dağıtım API'si gelince gece koşusu kendisi yükler (Roadmap Faz 10).
acik = true
haftada = 1  # Roadmap Faz 8: kabul gelince düzenli yayın, haftada bir
yayin_on_gun = 21  # yüklemeden kaç gün sonrası yayın tarihi önerilsin (ücretsiz inceleme günler sürüyor; pitch ≥ 7 gün)
# "ilk_kabul": ilk parça Spotify'a çıkana kadar bekle (Faz 7: kabul gelmeden RouteNote'a daha fazla yükleme yok)
baslangic = "ilk_kabul"
