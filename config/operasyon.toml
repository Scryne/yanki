# Gece koşusunun bakım adımları (yanki/yedek.py, yanki/temizlik.py). Roadmap Faz 13.

[yedek]
# Yeniden üretilemeyen durum (seçimler, yükleme bilgisi, keşif kaydı, liste, ayarlar, özel kapaklar) tek zip'te; ses ve
# sır (.env, Spotify token'ı) yok, boyut birkaç MB. Varsayılan aynı diskte: yanlışlıkla silme ve bozuk yazıma karşı.
# Disk arızasına karşı başka bir diskte ya da eşitlenen bir klasörde tam yol yazılabilir (ör. "D:/Yedek/Yanki").
klasor = "calisma/yedek"
# Gece koşusu son yedek bundan eskiyse (gün) yeni yedek alır; elle: `yanki yedekle`
gun = 7
# En yeni kaç yedek kalsın
sakla = 8

[temizlik]
# Yüklenmiş şarkılarda seçilmeyen adayların ve ara seslerin silinmesi için yüklemenin üstünden geçmesi gereken gün
gun = 14

[gunduz]
# `bosta_dk`: bilgisayar bu kadar dakikadır kullanılmıyorsa "boşta" sayılır. Sürekli koşu buna bakarak açık Spotify
# uygulamasını (keşif, takip) yeniden başlatır; `[surekli] bosta_bekle = true` ise üretim de bunu bekler.
# Diğerleri yalnız elle `yanki gunduz` (eski boştayken üretim görevi, 2026-10-10'da \Yanki\Surekli'ye katıldı).
acik = true
bosta_dk = 20
sarki = 1
saatler = [8, 1]  # 08:00'den 01:00'e

[surekli]
# Üretim açık mı. 2026-10-12'de kapatıldı (Scryne: "üretim dursun, boş yere üretmesin; öncelikli hedefimiz gerçekleşene
# kadar bekleyelim"). 2026-10-13'te açıldı (Scryne: "üretimi yeniden aç ve çok kapsamlı olsun"): dördüncü eğitimle kör
# testte yayınlanabilir 4/17 → 9/17 (docs/arastirma/07, S31). Deneyler (spikes, eğitim) bundan etkilenmez.
# 2026-10-13 akşam duraklatıldı: beşinci eğitim (tür verisi) ve kör testi bitene kadar; sıradaki şarkılar kazanan
# modelle üretilsin, ep20 ile üretilip boşa harcanmasın (Scryne: "modeli en iyi hale getirmeliyiz").
# 2026-10-15 açıldı (Scryne: "sistemi en güncel, en iyi şekilde sonuç veren haliyle başlat; müzik üretiminin en iyi
# olduğu türlerde üretsin, direkt RouteNote'ta paylaşılsın"; S34 Scryne söyleyince). Tarif ep20 + CFG 10; tür dışı
# şarkılar üretilmez (uretim.tur_disi).
uretim = true
# Sürekli koşu (\Yanki\Surekli, bilgisayar açıkken her 30 dk; Scryne 2026-10-10: "açıkken hep çalışsın").
# Bir koşuda en çok kaç şarkı üretilsin: uzun üretim (şarkı başı ~30 dk) yüklemeyi ve yoklamayı saatlerce kilitlemesin
uretim_sarki = 2
# true: üretim yalnız bilgisayar [gunduz] bosta_dk'dır kullanılmıyorken (oyun/iş sırasında GPU yükü olmasın)
bosta_bekle = false
