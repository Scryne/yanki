[katalog]
# Kendi keşfimiz (STILLMORE'suz): Deezer'da çok dinlenen ama Spotify'da kapalı/olmayan şarkılar (yanki/katalog.py).
acik = true
# Elle tohumlar (rank eşiği yok, sorma sırasında önce). Boş (Denetim 3, 2026-10-10): önceki tohumlar kataloğunu
# Spotify'dan 2025'te protestoyla çeken sanatçılardı (Massive Attack, King Gizzard, Godspeed You! Black Emperor,
# Deerhoof, Xiu Xiu, Hotline TNT). Keşfin puanlı 29 adayının 26'sı onlardan geldi; hepsi deneysel/enstrümantal,
# hattın balad/pop tarifinin dışında ve sanatçının bilinçli boşluğu (tepki riski). Adayları kayıtta "elendi".
tohumlar = []
# Playlist'lerde en sık geçen kaç sanatçı tohum olsun (Scryne'ın zevki)
playlist_sanatcilari = 30
# Deezer tür listeleri (0 hepsi, 132 pop, 152 rock, 165 R&B, 85 alternatif; 116 rap çıkarıldı: hattın türü değil).
# Deezer listeyi IP'nin ülkesine göre veriyor (bu ağda Türkiye); global genişleme benzer sanatçılardan gelir.
liste_turleri = [0, 132, 152, 165, 85]
liste_adet = 25
benzer_adet = 5
parca_adet = 15
# Deezer rank (0–1.000.000, parçanın Deezer'daki genel popülerliği) eşiği
min_rank = 300000
# Koşu başına en fazla Spotify isteği; kalan parçalar sonraki gecelere kalır (önbellek: calisma/kesif/katalog.json)
butce = 150
# Spotify'da "var" çıkan parça bu kadar gün yeniden sorulmaz
tazeleme_gun = 30

[takip]
