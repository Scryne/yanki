# Kaldırılmış şarkı keşfi ve yayın takibi (`yanki kesif`, `yanki takip`). Gerekçe: yanki/kesif.py, katalog.py, takip.py.
# Spotify anahtarları burada değil: proje kökündeki .env (SPOTIFY_CLIENT_ID, SPOTIFY_CLIENT_SECRET; gitignore'da).
# Global çalışılıyor (Scryne, 2026-10-09): kapalılık ve arama sırası tek ülkede değil, aşağıdaki pazarlarda ölçülür.

