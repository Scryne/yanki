[project]
name = "yanki"
version = "0.1.0"
description = "Listedeki şarkıların ACE-Step ile cover'ını üretip Spotify yükleme paketi hazırlayan yarı otomatik hat"
requires-python = ">=3.12"
dependencies = [
    "curl-cffi>=0.16",
    "fastapi>=0.143.0",
    "faster-whisper>=1.2",
    "httpx2>=2.13",
    "jiwer>=4",
    "numpy>=2.5.4",
    "pillow>=11",
    "soundfile>=0.13",
    "typesafe-sdk>=0.7.4",
    "uvicorn>=0.37",
    "websockets>=17.2",
    "yt-dlp[default]>=2026.8.19",
]

[project.scripts]
yanki = "yanki.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8",
    "ruff>=0.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["spikes", "motor", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
