[project]
name = "yanki"
version = "0.1.0"
description = "Listedeki şarkıların ACE-Step ile cover'ını üretip Spotify yükleme paketi hazırlayan yarı otomatik hat"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
yanki = "yanki.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["spikes", "motor", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
