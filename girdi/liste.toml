# Yanki şarkı listesi — hat yalnız buradakileri işler.
# Her şarkı bir [[sarki]] bloğu. Zorunlu: sanatci, ad. Gerisi isteğe bağlı.
#
# [[sarki]]
# sanatci = "Adele"
# ad = "Someone Like You"
# youtube = "https://www.youtube.com/watch?v=..."    # kaynak videoyu sabitlemek istersen
# stil = "acoustic guitar ballad, warm female vocal"  # cover'ın stili (yoksa şarkıdan otomatik çıkarılır)
# vokal = "kadin"                                     # "kadin" | "erkek"
# bpm = 68
# ton = "A major"
#
# Kaynak sesi kendin vermek istersen: girdi/kaynak/<kimlik>.mp3  (kimlik: "adele-someone-like-you")
# Sözleri kendin vermek istersen:     girdi/sozler/<kimlik>.txt

# 2026-10-08: Scryne seçimi Claude'a bıraktı ("her şeyi sana bırakıyorum"). Ölçüt: hattın iyi çıktığı türe yakın
# (Adele söz WER 0,015, Coldplay 0,032; Ed Sheeran zayıf): tek solo vokal, piyano/akustik, yavaş-orta balad, çok dinlenen.
# Tarif "doğru stil + BPM + ton" (Final-Dokuman); en iyi sonuç (Adele) elle verilmiş stil/BPM/tonla alındı.
# bpm/ton yalnız iki kaynak uyuşunca yazıldı: kaynak sesten librosa ölçümü (vuruş aralığı medyanı + Krumhansl
# chroma; Someone Like You A major, Viva La Vida Ab major, Perfect Ab major ile sınandı) ve yaygın bilinen değer.
# Uyuşmayan boş: You Are the Reason bpm (85–86 arası oynadı), Young and Beautiful bpm/ton (D major / B minor ayrışmadı).

